# Hyperparameters are our choice; there is no official partial-update recipe.
model:
  id: google/embeddinggemma-2
  mode: partial_finetune
  precision: bf16
  trainable_scope: null
classifier:
  type: common_head
  trained_on: train_pairs_20000
training:
  optimizer: AdamW
  lr: 0.00001
  weight_decay: 0.0
  schedule: cosine
  warmup_ratio: 0.03
  batch_size: 32
  epochs: 1
  seed: 0
probe:
  candidates: ["last_k:<principal>:1", "last_k:<principal>:2", "last_k:<principal>:4", "all"]
  steps: 3
